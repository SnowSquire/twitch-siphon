#:schema https://www.schemastore.org/cargo.json
[package]
name = "siphon"
version = "0.1.3"
description = "A twtich notifier"
authors = ["Ozeniken"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# UI + tray + single-instance: the standalone `tray-icon` crate is the same
# code Tauri wraps, usable without Tauri (see tray-icon/examples/egui.rs).
# `wgpu` renderer, Vulkan only: `wgpu_no_default_features` pulls the crates
# with no backends, so the direct `wgpu` dep below is the sole backend
# selector.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "links",
  "wayland",
  "wgpu_no_default_features",
] }
egui = "0.36"
# Sync+async MPMC channels bridging the GUI thread and the work runtime.
kanal = "0.1"
# Only for `select!` over the `tray-icon` global receivers, lowkey want to drop both this and tray-icon
crossbeam-channel = "0.5"
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
app-single-instance = "0.1"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
open = "5"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
compio = { version = "0.19", features = [
  "macros",
  "fs",
  "runtime",
  "time",
  "net",
  "ws",
  "ws-connect",
  "tls",
  "rustls",
  "webpki-roots",
] }
cyper = { version = "0.9", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "sink",
  "async-await-macro",
] }
log = "0.4"
# Sole wgpu backend selector (see the eframe comment above).
wgpu = { version = "30", default-features = false, features = [
  "vulkan",
  "vulkan-portability",
] }


[target."cfg(windows)".dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.8"
# Minimal Win32 surface for hide-to-tray (ShowWindow), per emilk/egui#737.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# notify-rust only serves non-Windows toasts; keeping it out of the Windows
# graph avoids its tauri-winrt-notification 0.7 chain pinning `windows` 0.61
# while wgpu needs it unified on 0.62 (two copies break the DX12 backend).
[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = { version = "4", features = ["async"] }


[package.metadata.packager]
productName = "Siphon"
identifier = "com.iken.siphon"
description = "Twitch notifier: track streamers, get a toast the moment they go live."
homepage = "https://github.com/SnowSquire/twitch-siphon"
publisher = "Ozeniken"
category = "Utility"
licenseFile = "LICENSE"
icons = ["icons/icon.ico", "icons/icon.png"]

# Per-user MSI: cargo-packager has no install-scope option, so the WiX
# template is overridden (see packaging/wix/main.wxs). Installs to
# %LocalAppData% without elevation.
[package.metadata.packager.wix]
template = "packaging/wix/main.wxs"

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
str_to_string = "warn"
missing_errors_doc = "allow"
too_many_lines = "allow"
missing_const_for_fn = "allow"
# compio is thread-per-core: cyper + compio-ws futures are intentionally !Send
# and run on the single hermes runtime thread (or throwaway resolve threads).
future_not_send = "allow"

# Tray-specific overrides
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
