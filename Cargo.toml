#:schema https://www.schemastore.org/cargo.json
[package]
name = "siphon"
version = "0.3.0"
description = "A twtich notifier"
authors = ["Ozeniken"]
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
# UI: Slint (retained). Layout lives in `ui/siphon.slint`, compiled by
# `slint-build` in `build.rs`; `src/app.rs` only maps the worker `Snapshot`
# onto properties and forwards callbacks as `UiIntent`s. Video later rides
# `Image::try_from(wgpu::Texture)` zero-copy imports, never CPU copies.
# `raw-window-handle-06` exposes the winit HWND so the minimize button can
# hide to the tray; Slint gates `Window::window_handle` behind the feature.
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
# Sync MPMC channels bridging the GUI thread and the work runtime.
# Sole rustls crypto provider, enabled explicitly: hyper-rustls in wgpui's
# tree used to switch `ring` on transitively, and provider auto-detection
# panics with zero providers (or more than one). Mirrors hyper-rustls's
# rustls features so protocol and logging behavior stay as they were.
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
kanal = "0.1"
anyhow = "1"
app-single-instance = "0.1"
dirs = "6"
open = "5"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
compio = { version = "0.19", features = [
  "fs",
  "runtime",
  "time",
  "net",
  "ws",
  "ws-connect",
  "tls",
  "rustls",
  "rustls-platform-verifier",
] }
# Single TLS stack: rustls against the OS trust store everywhere. cyper's
# `rustls` is `rustls-platform-verifier`, and compio-ws gets the same
# verifier instead of the Mozilla bundle, so `native-tls` (SChannel/OpenSSL)
# is out of our subgraph. cyper defaults stay off: its default is `native-tls`.
cyper = { version = "0.9", default-features = false, features = [
  "stream",
  "rustls",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await-macro",
] }
log = "0.4"
winreg = "0.55"
tauri-winrt-notification = "0.8"
# WinRT system theme notifications (no new thread: callbacks notify through
# the existing gui sender from the system pool).
windows = { version = "0.62", features = [
  "Foundation",
  "UI_ViewManagement",
  "Win32_System_Com",
] }

windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[package.metadata.packager]
productName = "Siphon"
identifier = "com.iken.siphon"
description = "Twitch notifier: track streamers, get a toast the moment they go live."
homepage = "https://github.com/SnowSquire/twitch-siphon"
publisher = "Ozeniken"
category = "Utility"
licenseFile = "LICENSE-APACHE"
icons = ["icons/icon.ico", "icons/icon.png"]

# Per-user MSI: cargo-packager has no install-scope option, so the WiX
# template is overridden (see packaging/wix/main.wxs). Installs to
# %LocalAppData% without elevation.
[package.metadata.packager.wix]
template = "packaging/wix/main.wxs"

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
str_to_string = "warn"
missing_errors_doc = "allow"
too_many_lines = "allow"
missing_const_for_fn = "allow"
# compio is thread-per-core: cyper + compio-ws futures are intentionally !Send
# and run on the single hermes runtime thread (or throwaway resolve threads).
future_not_send = "allow"

# `cast_*` for tray pixel math; `missing_panics_doc` for Win32 fns that only
# fail on programmer error.
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
