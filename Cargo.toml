#:schema https://www.schemastore.org/cargo.json
[package]
name = "siphon"
version = "0.1.3"
description = "A twtich notifier"
authors = ["Ozeniken"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# UI + tray + single-instance: the standalone `tray-icon` crate is the same
# code Tauri wraps, usable without Tauri (see tray-icon/examples/egui.rs).
# `wgpu` stays off for now: `gpu-allocator 0.28` caps `windows` at `<=0.62`
# (excludes 0.62.2) while `wgpu-hal 30` wants `^0.62`, forking the `windows`
# crate inside the DX12 backend and breaking the build. Only `glow` (OpenGL)
# is needed until upstream fixes the bound or the Vulkan work starts.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
  "wayland",
  "x11",
] }
egui = "0.36"
# Same channel impl the tray receivers are built on; lets the watcher
# thread block on both receivers at once.
crossbeam-channel = "0.5"
# `ksni` backend on Linux (pure-Rust StatusNotifierItem over D-Bus) instead of
# `libappindicator`: no GTK, no system tray dev-packages, no gtk event-loop
# thread. `ksni` itself is enabled without its tokio default (async-io +
# blocking only), keeping the tree tokio-free. No-op on Windows/macOS, where
# the `ksni` optional dependency doesn't apply.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
app-single-instance = "0.1"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
open = "5"
env_logger = "0.11"
notify-rust = { version = "4", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
compio = { version = "0.19", features = [
  "macros",
  "fs",
  "runtime",
  "time",
  "net",
  "ws",
  "ws-connect",
  "tls",
  "rustls",
  "webpki-roots",
] }
cyper = { version = "0.9", features = ["json", "stream"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "sink",
  "async-await-macro",
] }
log = "0.4"


[target."cfg(windows)".dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.7"
# Minimal Win32 surface for hide-to-tray (ShowWindow), per emilk/egui#737.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
str_to_string = "warn"
missing_errors_doc = "allow"
too_many_lines = "allow"

# compio is thread-per-core: cyper + compio-ws futures are intentionally !Send
# and run on the single hermes runtime thread (or throwaway resolve threads).
future_not_send = "allow"

# Tray-specific overrides
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_panics_doc = "allow"
