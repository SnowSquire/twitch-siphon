name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # Cross-compile for Windows on the self-hosted Fedora runner with
    # cargo-xwin (MSVC CRT and Windows SDK are auto-downloaded; this
    # consents to the MS license at
    # https://go.microsoft.com/fwlink/?LinkId=2086102).
    # Toolchain (Rust target, xwin, system deps) is pre-installed on the runner.
    runs-on: [self-hosted, fedora-release]
    env:
      # Only fetch the x86_64 CRT/SDK, not aarch64.
      XWIN_ARCH: x86_64
      # The Actions environment forces CARGO_INCREMENTAL=0; re-enable it
      # since this runner keeps a persistent target/ dir.
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: cross-build Windows binary
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc

      - name: prepare portable binary
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          cp "target/x86_64-pc-windows-msvc/release/siphon.exe" "Siphon_${version}_x64-portable.exe"
          # Stage into dist/ so the artifact has a flat, predictable layout
          # (upload-artifact preserves workspace-relative paths otherwise).
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/siphon.exe dist/siphon.exe
          cp "Siphon_${version}_x64-portable.exe" dist/

      - name: upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: dist

  package-msi:
    # WiX (candle/light) only runs on Windows, so this job just packages the
    # cross-built binary; nothing is compiled here.
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: download Windows binary
        uses: actions/download-artifact@v7
        with:
          name: windows-bin
          path: windows-bin

      - name: cache cargo-packager
        id: packager-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-0.11.8-x86_64-pc-windows-msvc

      - name: install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: stage binary for packager
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item windows-bin/siphon.exe target/release/siphon.exe

      - name: package MSI
        # WiX 3.11 toolchain is auto-downloaded by cargo-packager.
        run: cargo packager --release --formats wix

      - name: upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            windows-bin/Siphon_*-portable.exe
            target/release/*.msi
          draft: true

  build-linux:
    # System deps and cargo-packager are pre-installed on the self-hosted runner.
    runs-on: [self-hosted, fedora-release]
    # linuxdeploy/appimagetool run as extracted AppImages: no FUSE needed
    # natively, but keep this set in case FUSE is unavailable.
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      # linuxdeploy ships an ancient strip that chokes on .relr.dyn
      # (emitted by modern linkers); our binary is already stripped
      # via Cargo, so skip deploy-time stripping entirely.
      NO_STRIP: 1
      # The Actions environment forces CARGO_INCREMENTAL=0; re-enable it
      # since this runner keeps a persistent target/ dir.
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: build release binary
        run: cargo build --release --locked

      - name: package AppImage
        run: cargo packager --release --formats appimage

      - name: upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: target/release/*.AppImage
          draft: true
