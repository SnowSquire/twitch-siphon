name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: build portable binary
        run: cargo build --release --locked
        working-directory: src-tauri

      - name: prepare portable binary
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          Copy-Item "src-tauri/target/release/siphon.exe" "Siphon_${version}_x64-portable.exe"

      - name: upload portable binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Siphon_*-portable.exe
          draft: true
