name: clippy

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl-dev libegl-dev libwayland-dev libxkbcommon-dev

      # Workspace lints already deny warnings; plain clippy is enough.
      - name: clippy (linux)
        run: cargo clippy --all-targets --locked

      # Check-only: clippy never links, so no MSVC toolchain needed.
      - name: clippy (windows)
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc
